name: powerocr
description: "PowerOCR"
publish_to: 'none'
version: 1.4.0+29

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  line_icons: ^2.0.3
  retrofit: ^4.7.2
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  hive_ce: ^2.15.1
  json_annotation: ^4.9.0
  get_it: ^9.2.0
  go_router: ^17.0.0
  dio: ^5.9.0
  bloc: ^9.0.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  injectable: ^2.5.2
  uuid: ^4.5.1
  bloc_concurrency: ^0.3.0
  envied: ^1.3.2
  camera: ^0.12.0
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.1.2
  connectivity_plus: ^7.0.0
  google_mlkit_barcode_scanning: ^0.14.2
  google_mlkit_language_id: ^0.13.1
  image: ^4.5.4
  pdf: ^3.12.0
  share_plus: ^12.0.1
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  firebase_messaging: ^16.1.3
  qr_flutter: ^4.1.0
  flutter_localization: ^0.4.0
  shared_preferences: ^2.5.5
  pretty_qr_code: ^3.6.0
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.7.0
  google_mobile_ads: ^8.0.0
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.6.2
  hive_ce_generator: ^1.10.0
  retrofit_generator: ^10.1.2
  injectable_generator: ^2.6.2
  envied_generator: ^1.3.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-BlackItalic.ttf
          weight: 900
          style: italic
