name: powerocr
description: "PowerOCR"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  line_icons: ^2.0.3
  retrofit: ^4.7.2
  equatable: ^2.0.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  hive_ce: ^2.15.1
  json_annotation: ^4.9.0
  get_it: ^9.2.0
  go_router: ^17.0.0
  dio: ^5.9.0
  bloc: ^9.0.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  injectable: ^2.5.2
  uuid: ^4.5.1
  bloc_concurrency: ^0.3.0
  envied: ^1.3.2
  camera: ^0.11.3
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.1
  google_mlkit_barcode_scanning: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.6.2
  hive_ce_generator: ^1.10.0
  retrofit_generator: ^10.1.2
  injectable_generator: ^2.6.2
  envied_generator: ^1.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/fonts/
    - assets/icons/
